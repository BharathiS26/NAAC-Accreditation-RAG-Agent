[project]
name = "naac-rag-agent"
version = "1.0.0"
description = "NAAC Accreditation RAG Agent using IBM Granite and watsonx.ai"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pymupdf==1.24.5",
    "sentence-transformers==3.0.1",
    "faiss-cpu==1.8.0",
    "requests==2.32.3",
    "python-dotenv==1.0.1",
    "numpy==1.26.4",
    "jinja2==3.1.4",
    "python-multipart==0.0.9",
    "ibm-watsonx-ai==1.1.2",
]

[project.scripts]
orchestrate = "naac_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["naac_rag"]
